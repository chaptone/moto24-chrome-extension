<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Moto24 พรบ Auto-Fill</title>
    <style>
      body {
        margin: 0;
        padding: 14px 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        min-width: 300px;
        max-width: 340px;
        color: #111;
      }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: #333; }
      .state { padding: 10px 12px; border-radius: 8px; border: 1px solid #e5e7eb; }
      .state.idle { background: #f9fafb; color: #6b7280; }
      .state.working { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
      .state.wait_login { background: #fef9c3; border-color: #fde68a; color: #92400e; }
      .state.done { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
      .state.error { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
      .label { font-weight: 600; margin-bottom: 2px; }
      .msg { font-size: 12px; }
      .section { margin-top: 10px; }
      .section h3 { font-size: 12px; font-weight: 600; margin: 0 0 4px; }
      ul { list-style: none; padding: 0; margin: 0; font-size: 12px; }
      li { padding: 2px 0; }
      li.filled::before { content: "✓ "; color: #16a34a; }
      li.skipped::before { content: "• "; color: #92400e; }
      .skipped-value { color: #6b7280; }
    </style>
  </head>
  <body>
    <h1>Moto24 พรบ Auto-Fill</h1>
    <div id="state" class="state idle">
      <div class="label">พร้อมใช้งาน</div>
      <div class="msg">รอรับคำสั่งจากหน้า moto24</div>
    </div>
    <div id="filled-section" class="section" hidden>
      <h3>กรอกแล้ว</h3>
      <ul id="filled-list"></ul>
    </div>
    <div id="skipped-section" class="section" hidden>
      <h3>ข้ามไป</h3>
      <ul id="skipped-list"></ul>
    </div>
    <script src="field-labels.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
